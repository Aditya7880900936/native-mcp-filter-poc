static_resources:

  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000

      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager

                stat_prefix: ingress_http

                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

                route_config:
                  name: local_route

                  virtual_hosts:
                    - name: backend
                      domains: ["*"]

                      routes:

                        - match:
                            prefix: "/"
                            headers:
                              - name: x-tool-backend
                                exact_match: github

                          route:
                            cluster: github_service

                        - match:
                            prefix: "/"
                            headers:
                              - name: x-tool-backend
                                exact_match: weather

                          route:
                            cluster: weather_service

                http_filters:

                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua

                      inline_code: |
                        function envoy_on_request(request_handle)

                          local body = request_handle:body():getBytes(
                            0,
                            request_handle:body():length()
                          )

                          request_handle:logInfo(
                            "MCP BODY: " .. body
                          )

                          local tool = string.match(
                            body,
                            '"name"%s*:%s*"([^"]+)"'
                          )

                          if tool ~= nil then

                            request_handle:logInfo(
                              "TOOL NAME => " .. tool
                            )

                            if string.find(tool, "github") then

                              request_handle:headers():add(
                                "x-tool-backend",
                                "github"
                              )

                            elseif string.find(tool, "weather") then

                              request_handle:headers():add(
                                "x-tool-backend",
                                "weather"
                              )

                            end

                          end

                        end

                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz

                      http_service:

                        server_uri:
                          uri: http://auth:9000
                          cluster: auth_service
                          timeout: 5s

                        path_prefix: /auth

                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: x-tool-backend

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:

    - name: weather_service
      connect_timeout: 5s
      type: LOGICAL_DNS

      load_assignment:
        cluster_name: weather_service

        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: weather
                      port_value: 8081

    - name: github_service
      connect_timeout: 5s
      type: LOGICAL_DNS

      load_assignment:
        cluster_name: github_service

        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: github
                      port_value: 8082

    - name: auth_service
      connect_timeout: 5s
      type: LOGICAL_DNS

      load_assignment:
        cluster_name: auth_service

        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: auth
                      port_value: 9000